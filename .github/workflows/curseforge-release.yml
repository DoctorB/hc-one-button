# Setup, publishing and recovery: docs/RELEASING.md
name: CurseForge release

on:
  release:
    types: [published]
  # Manual runs validate/package only: they never upload to CurseForge.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curseforge-${{ github.event.release.id || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # Check both the original initiator and the person requesting a rerun.
    # This guard runs before allocating a runner or exposing the upload secret.
    if: >-
      github.repository == 'DoctorB/hc-one-button' &&
      (github.actor == 'DoctorB' || github.actor == 'DoctorCalibano') &&
      (github.triggering_actor == 'DoctorB' || github.triggering_actor == 'DoctorCalibano')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lua5.1

      - name: Test release tooling (offline)
        run: python3 -B -m unittest discover -s tests -p 'test_release_pipeline.py' -v

      - name: Parse addon and run all Lua regressions
        shell: pwsh
        run: ./tests/run.ps1 -LuaPath /usr/bin/lua5.1 -LuacPath /usr/bin/luac5.1

      - name: Validate metadata and build ZIP/changelog
        run: python3 -B scripts/curseforge_release.py prepare

      - name: Save verified package and release notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: curseforge-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/ci/
          if-no-files-found: error
          retention-days: 30

      - name: Upload to CurseForge
        if: github.event_name == 'release'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python3 -B scripts/curseforge_release.py upload

      - name: Save upload receipt if available
        if: always() && github.event_name == 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: curseforge-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/ci/curseforge-receipt.json
          if-no-files-found: ignore
          retention-days: 90
